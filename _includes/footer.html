<footer class="site-footer">
  <div class="container">
    <div class="footer-row">
      <a class="footer-email" href="mailto:{{ site.email }}">{{ site.email }}</a>
      <div class="footer-links">
        <a href="https://github.com/{{ site.github_username }}">GitHub</a>
        <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}/">LinkedIn</a>
        <a href="{{ site.resume | relative_url }}">Resume</a>
      </div>
    </div>
    <p class="footer-copy">© {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
  </div>
</footer>
