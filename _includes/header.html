<header class="site-header">
  <nav class="container nav" aria-label="Main">
    <a class="nav-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <div class="nav-links">
      {%- for item in site.data.navigation -%}
        {%- assign active = false -%}
        {%- if page.url == item.url -%}{%- assign active = true -%}{%- endif -%}
        {%- if item.url == '/writing/' and page.layout == 'post' -%}{%- assign active = true -%}{%- endif %}
      <a href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
      <a class="btn btn-accent btn-small" href="{{ site.resume | relative_url }}">Resume</a>
    </div>
  </nav>
</header>
