# Site settings
title: Yousef Al Hashemi
tagline: Focused on elegant engineering.
description: >-
  Software engineer working on FPGA design tools at Altera. Projects, experience,
  and writing on things I'm curious about.
url: "https://yousefalhashemi.com"
baseurl: ""
lang: en

author:
  name: Yousef Al Hashemi

# Email is stored in two parts and only joined by JavaScript in the browser,
# so the full address never appears in the HTML or RSS feed that scrapers read.
email_user: yousefalhashemi20
email_domain: gmail.com

# Links used in the header, hero and footer
github_username: Yalhash
linkedin_username: yousefalhashemi
resume: /resume.pdf
location: Canada

# Blog
permalink: /writing/:year/:title/
words_per_minute: 200

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# All three plugins are supported on GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: writing/feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - scripts
  - .bundle
